name: CI

# Kører ved hver push og pull request. Giver et grønt/rødt flueben på PR'en,
# adskilt fra Netlify-deployet (bruger ikke Netlify-build-minutter).
#
# Bevidst afgrænset: typecheck (tsc) over HELE projektet + guides-sync-testene.
# Projekt-bred `npm run lint` er IKKE med — kodebasen har eksisterende
# lint-gæld (mange fejl uden relation til denne CI), og en altid-rød lint ville
# gøre fluebenet meningsløst. Ryd lint-gælden op i eget spor, og tilføj så
# `npm run lint` her.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
